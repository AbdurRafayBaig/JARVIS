[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Personal AI Computer Agent for Windows"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jarvis Team", email = "jarvis@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "anyio>=4.3.0",
    "trio>=0.25.0",
    "loguru>=0.7.2",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.1",
    "openai>=1.30.0",
    "anthropic>=0.39.0",
    "ollama>=0.3.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "pvporcupine>=3.0.0",
    "pyaudio>=0.2.14",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "opencv-python>=4.9.0",
    "pillow>=10.3.0",
    "mss>=9.0.1",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "psutil>=5.9.8",
    "wmi>=1.5.1",
    "comtypes>=1.2.0",
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "watchdog>=3.0.0",
    "gitpython>=3.1.40",
    "dulwich>=0.21.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-typescript>=0.20.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "python-pptx>=0.6.23",
    "pypdf>=4.1.0",
    "pdfplumber>=0.11.0",
    "PySide6>=6.7.0",
    "qasync>=0.26.0",
    # "qdarktheme>=1.1.0",  # Not compatible with Python 3.11
    "typer>=0.12.0",
    "click>=8.1.7",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.9.0",
    "croniter>=2.0.0",
    "cryptography>=42.0.0",
    "keyring>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "black>=24.3.0",
    "isort>=5.13.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.99.0",
]

[project.urls]
Homepage = "https://github.com/jarvis/jarvis"
Repository = "https://github.com/jarvis/jarvis"
Issues = "https://github.com/jarvis/jarvis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "llm*", "tools*", "ui*", "memory*", "security*", "services*", "browser*", "coding*", "integrations*", "desktop*"]

[tool.ruff]
line-length = 100
target-version = "py311"
indent-width = 4
preview = true

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "W", "C4", "C90", "PL", "RUF", "SIM", "TID", "TRY", "PTH", "ERA", "PD", "PYI", "QF", "RSE", "RET", "ARG", "FLY", "NPY", "PERF", "TCH", "INT", "ASYNC", "PIE", "B", "C", "DTZ", "EXE", "ICN", "ISC", "PD", "PGH", "PL", "PTH", "PYI", "RSE", "RET", "SIM", "TCH", "TID", "TRY", "UP", "W", "ARG", "B", "C", "C4", "C90", "D", "DTZ", "E", "ERA", "EXE", "F", "FLY", "ICN", "INT", "I", "ISC", "N", "NPY", "PD", "PERF", "PGH", "PIE", "PL", "PTH", "PYI", "QF", "RSE", "RET", "RUF", "S", "SIM", "TCH", "TID", "TRY", "UP", "W"
]
ignore = [
    "S101", "S311", "S603", "S607"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["agent", "core", "llm", "tools", "ui", "memory", "security", "services", "browser", "coding", "integrations", "desktop"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.alembic]
script_location = "database/migrations"